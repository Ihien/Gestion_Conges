<script>
/**
 * Genere le HTML d'un tableau de demandes
 * requests: tableau d'objets demande
 * options: { showEmployee: bool, showActions: bool, compact: bool }
 */
function renderTableDemandes(requests, options) {
  options = options || {};
  var showEmployee = options.showEmployee !== false;
  var compact = options.compact || false;

  if (!requests || requests.length === 0) {
    return '<div class="table-empty"><div class="empty-state-icon">&#128196;</div><p>Aucune demande trouvee</p></div>';
  }

  var html = '<div class="table-responsive"><table class="table">';

  // Header
  html += '<thead><tr>';
  if (showEmployee) {
    html += '<th>Employe</th>';
  }
  html += '<th>Type</th>';
  html += '<th>Du</th>';
  html += '<th>Au</th>';
  if (!compact) {
    html += '<th>Jours</th>';
  }
  html += '<th>Statut</th>';
  html += '<th>Action</th>';
  html += '</tr></thead>';

  // Body
  html += '<tbody>';
  for (var i = 0; i < requests.length; i++) {
    var req = requests[i];
    html += '<tr>';

    if (showEmployee) {
      html += '<td><strong>' + escapeHtml(req.prenom + ' ' + req.nom) + '</strong>';
      if (!compact) {
        html += '<br><span class="text-muted text-sm">' + escapeHtml(req.matricule) + '</span>';
      }
      html += '</td>';
    }

    html += '<td>' + escapeHtml(req.typeConge) + '</td>';
    html += '<td>' + formatDateDisplay(req.dateDebut) + '</td>';
    html += '<td>' + formatDateDisplay(req.dateFin) + '</td>';

    if (!compact) {
      html += '<td>' + (req.nbJours || '-') + '</td>';
    }

    html += '<td>' + renderBadgeStatut(req.statut) + '</td>';
    html += '<td><button class="btn btn-sm btn-outline" onclick="navigateTo(\'DetailDemande\', {id:\'' + escapeHtml(req.requestId) + '\'})">Voir</button></td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';

  return html;
}
</script>
