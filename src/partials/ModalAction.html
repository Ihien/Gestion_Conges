<script>
/**
 * Affiche un modal de confirmation pour une action de workflow
 * actionKey: string (ex: 'APPROVE_N1')
 * requestId: string
 * requireComment: boolean
 */
function showActionModal(actionKey, requestId, requireComment) {
  var actionLabels = {
    'APPROVE_N1': { title: 'Approuver la demande', btnText: 'Approuver', btnClass: 'btn-success' },
    'REJECT_N1': { title: 'Rejeter la demande', btnText: 'Rejeter', btnClass: 'btn-danger' },
    'AVIS_FAVORABLE': { title: 'Donner un avis favorable', btnText: 'Avis Favorable', btnClass: 'btn-success' },
    'AVIS_DEFAVORABLE': { title: 'Donner un avis defavorable', btnText: 'Avis Defavorable', btnClass: 'btn-warning' },
    'VALIDER': { title: 'Valider la demande (decision finale)', btnText: 'Valider', btnClass: 'btn-success' },
    'REJETER_FINAL': { title: 'Rejeter la demande (decision finale)', btnText: 'Rejeter', btnClass: 'btn-danger' },
    'ANNULER': { title: 'Annuler la demande', btnText: 'Confirmer l\'annulation', btnClass: 'btn-danger' }
  };

  var config = actionLabels[actionKey] || { title: 'Confirmer', btnText: 'Confirmer', btnClass: 'btn-primary' };
  var commentRequired = requireComment || ['REJECT_N1', 'AVIS_DEFAVORABLE', 'REJETER_FINAL'].indexOf(actionKey) !== -1;

  var html = '<h3 class="modal-title">' + config.title + '</h3>';

  html += '<div class="form-group">';
  html += '<label class="form-label">Commentaire' + (commentRequired ? ' (obligatoire)' : ' (optionnel)') + '</label>';
  html += '<textarea class="form-textarea" id="modal-comment" placeholder="Saisissez votre commentaire..."' + (commentRequired ? ' required' : '') + '></textarea>';
  html += '</div>';

  html += '<div class="modal-actions">';
  html += '<button class="btn btn-outline" onclick="forceCloseModal()">Annuler</button>';
  html += '<button class="btn ' + config.btnClass + '" id="modal-confirm-btn" onclick="confirmAction(\'' + actionKey + '\', \'' + requestId + '\', ' + commentRequired + ')">' + config.btnText + '</button>';
  html += '</div>';

  showModal(html);
}

/**
 * Confirme l'action et envoie au serveur
 */
function confirmAction(actionKey, requestId, commentRequired) {
  var comment = document.getElementById('modal-comment').value.trim();

  if (commentRequired && !comment) {
    showToast('Le commentaire est obligatoire pour cette action', 'error');
    return;
  }

  var confirmBtn = document.getElementById('modal-confirm-btn');
  confirmBtn.disabled = true;
  confirmBtn.textContent = 'Traitement...';

  serverCall('server_processAction', [requestId, actionKey, comment])
    .then(function(result) {
      forceCloseModal();
      showToast('Action effectuee avec succes', 'success');
      loadPendingCount();

      // Recharger la page de detail
      if (App.currentPage === 'DetailDemande') {
        loadDetailDemande({ id: requestId });
      } else {
        navigateTo('Dashboard');
      }
    })
    .catch(function(error) {
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Reessayer';
      showToast('Erreur : ' + error.message, 'error');
    });
}
</script>
