<!-- Page: Administration -->
<!-- Contenu charge dynamiquement par AdminController dans ce fichier -->

<script>
function AdminController_load() {
  var content = document.getElementById('app-content');
  var role = App.userProfile.role;

  if (role !== 'RH' && role !== 'DIRECTEUR_GENERAL') {
    content.innerHTML = '<div class="alert alert-danger">Acces reserve aux administrateurs (RH et Direction Generale).</div>';
    return;
  }

  var html = '<div class="card">';
  html += '<div class="card-header"><h2 class="card-title">Administration</h2></div>';

  // Tabs
  html += '<div class="tabs">';
  html += '<div class="tab active" onclick="AdminController_switchTab(\'employes\', this)">Employes</div>';
  html += '<div class="tab" onclick="AdminController_switchTab(\'soldes\', this)">Soldes de conges</div>';
  html += '<div class="tab" onclick="AdminController_switchTab(\'config\', this)">Configuration</div>';
  html += '</div>';

  html += '<div id="admin-tab-content"><div style="text-align:center;padding:20px;"><div class="spinner"></div></div></div>';
  html += '</div>';

  content.innerHTML = html;
  AdminController_loadEmployees();
}

function AdminController_switchTab(tab, element) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  element.classList.add('active');

  switch (tab) {
    case 'employes': AdminController_loadEmployees(); break;
    case 'soldes': AdminController_loadSoldes(); break;
    case 'config': AdminController_loadConfig(); break;
  }
}

// ===== TAB EMPLOYES =====
function AdminController_loadEmployees() {
  var container = document.getElementById('admin-tab-content');
  container.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spinner"></div></div>';

  serverCall('server_getEmployeeList')
    .then(function(employees) {
      var html = '<div class="mb-16 flex-between">';
      html += '<input type="text" class="form-input" style="max-width:300px;" placeholder="Rechercher un employe..." oninput="AdminController_filterEmployees(this.value)">';
      html += '</div>';

      html += '<div class="table-responsive"><table class="table" id="admin-employees-table">';
      html += '<thead><tr>';
      html += '<th>Matricule</th><th>Nom</th><th>Prenom</th><th>Departement</th>';
      html += '<th>Agence</th><th>Role</th><th>Solde</th><th>Actif</th>';
      html += '</tr></thead><tbody>';

      for (var i = 0; i < employees.length; i++) {
        var emp = employees[i];
        html += '<tr data-search="' + escapeHtml((emp.matricule + ' ' + emp.nom + ' ' + emp.prenom + ' ' + emp.departement).toLowerCase()) + '">';
        html += '<td>' + escapeHtml(emp.matricule) + '</td>';
        html += '<td>' + escapeHtml(emp.nom) + '</td>';
        html += '<td>' + escapeHtml(emp.prenom) + '</td>';
        html += '<td>' + escapeHtml(emp.departement) + '</td>';
        html += '<td>' + escapeHtml(emp.agence || 'Siege') + '</td>';
        html += '<td><span class="badge-statut badge-soumis">' + escapeHtml(emp.role) + '</span></td>';
        html += '<td>' + (emp.soldeConges || 0) + '</td>';
        html += '<td>' + (emp.actif === true || emp.actif === 'TRUE' ? 'Oui' : 'Non') + '</td>';
        html += '</tr>';
      }

      html += '</tbody></table></div>';
      container.innerHTML = html;
    })
    .catch(function(error) {
      container.innerHTML = '<div class="alert alert-danger">Erreur : ' + escapeHtml(error.message) + '</div>';
    });
}

function AdminController_filterEmployees(query) {
  var rows = document.querySelectorAll('#admin-employees-table tbody tr');
  var q = query.toLowerCase();
  for (var i = 0; i < rows.length; i++) {
    var searchText = rows[i].getAttribute('data-search') || '';
    rows[i].style.display = searchText.indexOf(q) !== -1 ? '' : 'none';
  }
}

// ===== TAB SOLDES =====
function AdminController_loadSoldes() {
  var container = document.getElementById('admin-tab-content');
  container.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spinner"></div></div>';

  serverCall('server_getTeamBalances')
    .then(function(balances) {
      var html = '<div class="mb-16">';
      html += '<button class="btn btn-warning btn-sm" onclick="AdminController_resetSoldes()">Reinitialiser les soldes annuels</button>';
      html += '</div>';

      html += '<div class="table-responsive"><table class="table">';
      html += '<thead><tr><th>Matricule</th><th>Nom</th><th>Prenom</th><th>Departement</th><th>Solde actuel</th><th>Allocation</th></tr></thead><tbody>';

      for (var i = 0; i < balances.length; i++) {
        var b = balances[i];
        var soldeClass = b.soldeConges <= 5 ? 'style="color:var(--color-danger);font-weight:700;"' : '';
        html += '<tr>';
        html += '<td>' + escapeHtml(b.matricule) + '</td>';
        html += '<td>' + escapeHtml(b.nom) + '</td>';
        html += '<td>' + escapeHtml(b.prenom) + '</td>';
        html += '<td>' + escapeHtml(b.departement) + '</td>';
        html += '<td ' + soldeClass + '>' + (b.soldeConges || 0) + '</td>';
        html += '<td>' + (b.soldeInitial || 30) + '</td>';
        html += '</tr>';
      }

      html += '</tbody></table></div>';
      container.innerHTML = html;
    })
    .catch(function(error) {
      container.innerHTML = '<div class="alert alert-danger">Erreur : ' + escapeHtml(error.message) + '</div>';
    });
}

function AdminController_resetSoldes() {
  if (!confirm('Etes-vous sur de vouloir reinitialiser les soldes de conges annuels pour tous les employes actifs ?')) {
    return;
  }
  showToast('Reinitialisation en cours...', 'info');
  // Note: cette fonction serait appelee via server_* si exposee
  // Pour l'instant, afficher un message
  showToast('Fonctionnalite disponible via l\'editeur Apps Script (LeaveCounter_initializeAnnualBalances)', 'info');
}

// ===== TAB CONFIG =====
function AdminController_loadConfig() {
  var container = document.getElementById('admin-tab-content');
  var html = '<div class="alert alert-info">La configuration est geree directement dans la feuille "Config" du Google Sheets.</div>';

  html += '<table class="table">';
  html += '<thead><tr><th>Parametre</th><th>Description</th></tr></thead><tbody>';
  html += '<tr><td>NOM_INSTITUTION</td><td>Nom de l\'institution affiche dans les emails et PDF</td></tr>';
  html += '<tr><td>WEBAPP_URL</td><td>URL de la Web App deployee (pour les liens dans les emails)</td></tr>';
  html += '<tr><td>HR_EMAILS</td><td>Emails RH (separes par virgule)</td></tr>';
  html += '<tr><td>DIR_CLIENTELE_EMAIL</td><td>Email du Directeur Clientele</td></tr>';
  html += '<tr><td>DIR_GENERAL_EMAIL</td><td>Email du Directeur General</td></tr>';
  html += '<tr><td>AUDIT_EMAILS</td><td>Emails Audit/Controle Permanent (separes par virgule)</td></tr>';
  html += '<tr><td>PDF_TEMPLATE_DOC_ID</td><td>ID du Google Doc template pour les PDF</td></tr>';
  html += '<tr><td>ARCHIVE_FOLDER_ID</td><td>ID du dossier Drive d\'archives</td></tr>';
  html += '<tr><td>SOLDE_ANNUEL_DEFAUT</td><td>Allocation annuelle par defaut (30 jours)</td></tr>';
  html += '</tbody></table>';

  container.innerHTML = html;
}
</script>
