<script>
/* =============================================================
 * Controllers.html
 * Dashboard, Formulaire (NouvelDemande), Detail, CalendrierEquipe,
 * Annuaire, MonProfil, Administration
 * ============================================================= */

// =============================================================
// DASHBOARD
// =============================================================
var DashboardState = { myRequests: [], pendingRequests: [], teamRequests: [], stats: null, myDocRequests: [], balanceDetail: null };

function loadDashboard() {
  var content = document.getElementById('app-content');
  var role = App.userProfile.role;
  var promises = [serverCall('server_getMyRequests'), serverCall('server_getPendingForMe'), serverCall('server_getDashboardStats'), serverCall('server_getMyDocumentRequests'), serverCall('server_getBalanceDetail')];
  if (role !== 'EMPLOYE') promises.push(serverCall('server_getTeamRequests'));

  Promise.all(promises).then(function(results) {
    DashboardState.myRequests = results[0] || [];
    DashboardState.pendingRequests = results[1] || [];
    DashboardState.stats = results[2] || {};
    DashboardState.myDocRequests = results[3] || [];
    DashboardState.balanceDetail = results[4] || null;
    DashboardState.teamRequests = results[5] || [];
    content.innerHTML = renderDashboard();
  }).catch(function(error) {
    content.innerHTML = '<div class="alert alert-danger">Erreur : ' + escapeHtml(error.message) + '</div>';
  });
}

function renderDashboard() {
  var html = '', role = App.userProfile.role, p = App.userProfile;
  var bd = DashboardState.balanceDetail;
  html += '<div class="stats-grid">';
  if (bd) {
    html += '<div class="stat-card"><div class="stat-value">' + bd.disponible + '</div><div class="stat-label">Jours disponibles</div><div class="text-sm text-muted" style="margin-top:4px;">' + bd.acquis + ' acquis - ' + bd.consomme + ' pris</div></div>';
  } else {
    html += '<div class="stat-card"><div class="stat-value">'+(p.soldeConges||0)+'</div><div class="stat-label">Jours de conge restants</div></div>';
  }
  html += '<div class="stat-card"><div class="stat-value">'+DashboardState.myRequests.length+'</div><div class="stat-label">Mes demandes</div></div>';
  if (DashboardState.pendingRequests.length > 0) {
    html += '<div class="stat-card" style="border-left:4px solid var(--color-warning);"><div class="stat-value" style="color:var(--color-warning);">'+DashboardState.pendingRequests.length+'</div><div class="stat-label">En attente de mon action</div></div>';
  }
  if (role !== 'EMPLOYE') html += '<div class="stat-card"><div class="stat-value">'+DashboardState.teamRequests.length+'</div><div class="stat-label">Demandes equipe</div></div>';
  html += '</div>';
  html += '<div class="mb-16"><button class="btn btn-primary btn-lg" onclick="navigateTo(\'NouvelDemande\')">+ Nouvelle demande de conge</button></div>';

  if (DashboardState.pendingRequests.length > 0) {
    html += '<div class="card"><div class="card-header"><h2 class="card-title">En attente de mon action</h2><span class="badge-count" style="font-size:0.9rem;min-width:24px;height:24px;">'+DashboardState.pendingRequests.length+'</span></div>';
    html += renderTableDemandes(DashboardState.pendingRequests, {showEmployee:true});
    html += '</div>';
  }

  html += '<div class="card"><div class="card-header"><h2 class="card-title">Mes demandes</h2></div>';
  html += '<div class="filters-bar"><div class="filter-pills">';
  html += '<span class="filter-pill active" onclick="dashboardFilter(\'all\',this)">Toutes</span>';
  html += '<span class="filter-pill" onclick="dashboardFilter(\'Soumis\',this)">Soumises</span>';
  html += '<span class="filter-pill" onclick="dashboardFilter(\'en_cours\',this)">En cours</span>';
  html += '<span class="filter-pill" onclick="dashboardFilter(\'Valide\',this)">Validees</span>';
  html += '<span class="filter-pill" onclick="dashboardFilter(\'rejete\',this)">Rejetees</span>';
  html += '</div></div>';
  html += '<div id="my-requests-table">' + renderTableDemandes(DashboardState.myRequests, {showEmployee:false}) + '</div></div>';

  if (role !== 'EMPLOYE' && DashboardState.teamRequests.length > 0) {
    html += '<div class="card"><div class="card-header"><h2 class="card-title">Demandes de l\'equipe</h2></div>';
    html += renderTableDemandes(DashboardState.teamRequests, {showEmployee:true}) + '</div>';
  }

  var st = DashboardState.stats;
  if (st && (st.conges || st.documents)) {
    html += '<div class="card"><div class="card-header"><h2 class="card-title">Suivi par categorie</h2></div>';
    if (st.conges) {
      html += '<h3 style="font-size:0.95rem;color:var(--color-gray-700);margin-bottom:12px;">Conges (' + st.conges.total + ' demandes)</h3>';
      html += '<div class="stats-grid" style="margin-bottom:20px;">';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-info);">' + st.conges.soumis + '</div><div class="stat-label">Soumises</div></div>';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-warning);">' + st.conges.enCours + '</div><div class="stat-label">En cours</div></div>';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-success);">' + st.conges.valide + '</div><div class="stat-label">Validees</div></div>';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-danger);">' + st.conges.rejete + '</div><div class="stat-label">Rejetees</div></div>';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-gray-500);">' + st.conges.annule + '</div><div class="stat-label">Annulees</div></div>';
      html += '</div>';
    }
    if (st.documents) {
      html += '<h3 style="font-size:0.95rem;color:var(--color-gray-700);margin-bottom:12px;">Documents RH (' + st.documents.total + ' demandes)</h3>';
      html += '<div class="stats-grid">';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-warning);">' + st.documents.enAttente + '</div><div class="stat-label">En attente</div></div>';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-info);">' + st.documents.enCours + '</div><div class="stat-label">En cours</div></div>';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-success);">' + st.documents.traitee + '</div><div class="stat-label">Traitees</div></div>';
      html += '<div class="stat-card"><div class="stat-value" style="color:var(--color-danger);">' + st.documents.rejetee + '</div><div class="stat-label">Rejetees</div></div>';
      html += '</div>';
    }
    html += '</div>';
  }

  if (DashboardState.myDocRequests.length > 0) {
    html += '<div class="card"><div class="card-header"><h2 class="card-title">Mes demandes de documents</h2></div>';
    html += renderDocRequestsTable(DashboardState.myDocRequests, false);
    html += '</div>';
  }

  return html;
}

function renderDocRequestsTable(requests, showEmployee) {
  if (!requests || requests.length === 0) {
    return '<div class="table-empty"><div style="font-size:3rem;margin-bottom:12px;">&#128196;</div><p>Aucune demande de document</p></div>';
  }
  var html = '<div class="table-responsive"><table class="table"><thead><tr>';
  if (showEmployee) html += '<th>Employe</th>';
  html += '<th>Type de document</th><th>Date demande</th><th>Statut</th><th>Date traitement</th><th>Notes</th>';
  if (showEmployee) html += '<th>Actions</th>';
  else html += '<th>Document</th>';
  html += '</tr></thead><tbody>';
  for (var i = 0; i < requests.length; i++) {
    var r = requests[i];
    html += '<tr>';
    if (showEmployee) html += '<td><strong>' + escapeHtml((r.prenom || '') + ' ' + (r.nom || '')) + '</strong><br><span class="text-muted text-sm">' + escapeHtml(r.emailEmp) + '</span></td>';
    html += '<td>' + escapeHtml(r.typeDocument) + '</td>';
    html += '<td>' + escapeHtml(r.dateDemande || '-') + '</td>';
    html += '<td>' + renderBadgeStatut(r.statut) + '</td>';
    html += '<td>' + escapeHtml(r.dateTraitement || '-') + '</td>';
    html += '<td>' + escapeHtml(r.notesRh || r.notesEmp || '-') + '</td>';
    if (showEmployee) {
      html += '<td>';
      if (r.statut === 'En attente') {
        html += '<div class="flex gap-8"><button class="btn btn-sm btn-success" onclick="processDocRequest(\'' + escapeHtml(r.demandeDocId) + '\',\'TRAITER\')">Traiter</button>';
        html += '<button class="btn btn-sm btn-danger" onclick="processDocRequest(\'' + escapeHtml(r.demandeDocId) + '\',\'REJETER\')">Rejeter</button></div>';
      } else if (r.statut === 'En cours') {
        html += '<button class="btn btn-sm btn-success" onclick="processDocRequest(\'' + escapeHtml(r.demandeDocId) + '\',\'TRAITER\')">Finaliser</button>';
      } else { html += '-'; }
      html += '</td>';
    } else {
      html += '<td>';
      if (r.documentUrl) html += '<a href="' + escapeHtml(r.documentUrl) + '" target="_blank" class="btn btn-sm btn-outline">Telecharger</a>';
      else html += '-';
      html += '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function dashboardFilter(filter, el) {
  var pills = document.querySelectorAll('.filter-pill');
  for (var i = 0; i < pills.length; i++) pills[i].classList.remove('active');
  el.classList.add('active');
  var filtered;
  if (filter === 'all') filtered = DashboardState.myRequests;
  else if (filter === 'en_cours') filtered = DashboardState.myRequests.filter(function(r){ return r.statut==='Approuve N1'; });
  else if (filter === 'rejete') filtered = DashboardState.myRequests.filter(function(r){ return r.statut==='Rejete N1'||r.statut==='Rejete'; });
  else filtered = DashboardState.myRequests.filter(function(r){ return r.statut===filter; });
  document.getElementById('my-requests-table').innerHTML = renderTableDemandes(filtered, {showEmployee:false});
}

// =============================================================
// NOUVELLE DEMANDE (7 types de conge)
// =============================================================
var MOTIF_REQUIRED_TYPES = ['Absence exceptionnelle', 'Conge maladie', 'Conge sans solde', 'Permission speciale'];

function loadNouvelDemande() {
  var p = App.userProfile, c = document.getElementById('app-content');
  c.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';

  serverCall('server_getBalanceDetail').then(function(bd) {
    App._balanceDetail = bd;
    var soldeDisponible = bd ? bd.disponible : (p.soldeConges || 0);
    var html = '<div class="card"><div class="card-header"><h2 class="card-title">Nouvelle demande de conge</h2></div>';
    html += '<form id="form-demande" onsubmit="submitDemande(event); return false;">';
    html += '<h3 class="mb-8" style="font-size:1rem;color:var(--color-gray-700);">Informations de l\'employe</h3>';
    html += '<div class="form-row">';
    html += formField('Matricule','matricule','text',p.matricule,false,'M0001');
    html += formField('Nom','nom','text',p.nom,true);
    html += '</div><div class="form-row">';
    html += formField('Prenom','prenom','text',p.prenom,true);
    html += formField('Poste','poste','text',p.poste,true);
    html += '</div><div class="form-row">';
    html += '<div class="form-group"><label class="form-label">Departement</label><input type="text" name="departement" class="form-input form-readonly" value="'+escapeHtml(p.departement)+'" readonly></div>';
    html += '<div class="form-group"><label class="form-label">Agence</label><input type="text" name="agence" class="form-input form-readonly" value="'+escapeHtml(p.agence||'Siege')+'" readonly></div>';
    html += '</div>';
    html += '<hr style="margin:20px 0;border:none;border-top:1px solid var(--color-gray-200);">';
    html += '<h3 class="mb-8" style="font-size:1rem;color:var(--color-gray-700);">Details du conge</h3>';
    html += '<div class="form-row"><div class="form-group"><label class="form-label">Type de conge *</label>';
    html += '<select name="typeConge" class="form-select" onchange="onTypeCongeChange(this.value)">';
    html += '<option value="">-- Selectionner --</option>';
    html += '<option value="Conges payes">Conges payes</option>';
    html += '<option value="Absence exceptionnelle">Absence exceptionnelle</option>';
    html += '<option value="Conge maternite">Conge maternite</option>';
    html += '<option value="Conge paternite">Conge paternite</option>';
    html += '<option value="Conge maladie">Conge maladie</option>';
    html += '<option value="Conge sans solde">Conge sans solde</option>';
    html += '<option value="Permission speciale">Permission speciale</option>';
    html += '</select></div>';
    html += '<div class="form-group"><label class="form-label">Solde disponible</label><div class="stat-card" style="padding:8px;text-align:center;"><span class="stat-value" style="font-size:1.5rem;">' + soldeDisponible + '</span><span class="stat-label"> jours</span>';
    if (bd) html += '<div class="text-sm text-muted" style="margin-top:2px;">' + bd.acquis + ' acquis (' + bd.moisTravailles + ' mois x ' + bd.tauxMensuel + ') - ' + bd.consomme + ' pris</div>';
    html += '</div></div></div>';
    html += '<div class="form-group hidden" id="motif-group"><label class="form-label">Motif / Justificatif *</label><textarea name="motif" class="form-textarea" placeholder="Precisez le motif ou le justificatif..."></textarea></div>';
    html += '<div class="form-row"><div class="form-group"><label class="form-label">Date de debut *</label><input type="date" name="dateDebut" class="form-input" onchange="calcDays()"></div>';
    html += '<div class="form-group"><label class="form-label">Date de fin *</label><input type="date" name="dateFin" class="form-input" onchange="calcDays()"></div></div>';
    html += '<div class="form-group"><label class="form-label">Nombre de jours ouvres</label><div id="nb-jours-display" class="alert alert-info" style="display:inline-block;padding:8px 16px;">Selectionnez les dates</div><input type="hidden" name="nbJours" value="0"></div>';
    html += '<div class="form-group"><label class="form-label">Responsable hierarchique</label><input type="text" class="form-input form-readonly" value="'+escapeHtml(p.managerEmail||'Non defini')+'" readonly></div>';
    html += '<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px;">';
    html += '<button type="button" class="btn btn-outline" onclick="navigateTo(\'Dashboard\')">Annuler</button>';
    html += '<button type="submit" class="btn btn-primary btn-lg" id="btn-submit">Soumettre la demande</button>';
    html += '</div></form></div>';
    c.innerHTML = html;
  }).catch(function(err) {
    c.innerHTML = '<div class="alert alert-danger">Erreur : ' + escapeHtml(err.message) + '</div>';
  });
}

function formField(label, name, type, value, readonly, placeholder) {
  var h = '<div class="form-group"><label class="form-label">'+label+(readonly?'':' *')+'</label>';
  h += '<input type="'+type+'" name="'+name+'" class="form-input'+(readonly?' form-readonly':'')+'" value="'+escapeHtml(value||'')+'"';
  if (readonly) h += ' readonly';
  if (placeholder) h += ' placeholder="'+placeholder+'"';
  return h + '></div>';
}

function onTypeCongeChange(val) {
  document.getElementById('motif-group').classList.toggle('hidden', MOTIF_REQUIRED_TYPES.indexOf(val) === -1);
}

function calcDays() {
  var d1 = document.querySelector('[name="dateDebut"]').value;
  var d2 = document.querySelector('[name="dateFin"]').value;
  var display = document.getElementById('nb-jours-display');
  var hidden = document.querySelector('[name="nbJours"]');
  if (!d1||!d2) { display.textContent='Selectionnez les dates'; display.className='alert alert-info'; hidden.value='0'; return; }
  display.textContent = 'Calcul en cours...';
  serverCall('server_calculateBusinessDays',[d1,d2]).then(function(nb){
    hidden.value = nb;
    if (nb > 0) {
      display.textContent = nb + ' jour'+(nb>1?'s':'')+' ouvre'+(nb>1?'s':'');
      display.className = 'alert alert-success';
      var type = document.querySelector('[name="typeConge"]').value;
      var soldeDispo = (App._balanceDetail ? App._balanceDetail.disponible : (App.userProfile.soldeConges||0));
      if (type==='Conges payes' && nb > soldeDispo) { display.textContent += ' (ATTENTION: solde insuffisant!)'; display.className='alert alert-danger'; }
    } else { display.textContent='Aucun jour ouvre dans cette periode'; display.className='alert alert-warning'; }
  }).catch(function(){ display.textContent='Erreur de calcul'; display.className='alert alert-danger'; });
}

function submitDemande(event) {
  event.preventDefault();
  ValidationFormulaire.clearErrors();
  var f = document.getElementById('form-demande');
  var data = {
    matricule: f.querySelector('[name="matricule"]').value,
    nom: f.querySelector('[name="nom"]').value,
    prenom: f.querySelector('[name="prenom"]').value,
    poste: f.querySelector('[name="poste"]').value,
    departement: f.querySelector('[name="departement"]').value,
    agence: App.userProfile.agence || '',
    typeConge: f.querySelector('[name="typeConge"]').value,
    motif: f.querySelector('[name="motif"]') ? f.querySelector('[name="motif"]').value : '',
    dateDebut: f.querySelector('[name="dateDebut"]').value,
    dateFin: f.querySelector('[name="dateFin"]').value,
    nbJours: parseInt(f.querySelector('[name="nbJours"]').value) || 0,
    soldeActuel: App._balanceDetail ? App._balanceDetail.disponible : (App.userProfile.soldeConges || 0)
  };
  var v = ValidationFormulaire.validateDemandeForm(data);
  if (!v.valid) { ValidationFormulaire.showErrors(v.errors); return; }
  var btn = document.getElementById('btn-submit'); btn.disabled=true; btn.textContent='Envoi en cours...';
  serverCall('server_submitRequest', data).then(function(){
    showToast('Demande soumise avec succes !','success'); loadPendingCount(); navigateTo('Dashboard');
  }).catch(function(error){
    showToast('Erreur: '+error.message,'error'); btn.disabled=false; btn.textContent='Soumettre la demande';
  });
}

// =============================================================
// DETAIL DEMANDE
// =============================================================
function loadDetailDemande(params) {
  var c = document.getElementById('app-content');
  var rid = params ? (params.id || params.requestId) : null;
  if (!rid) { c.innerHTML='<div class="alert alert-danger">Identifiant de demande manquant.</div>'; return; }
  serverCall('server_getRequestById', rid).then(function(req) {
    if (!req) {
      c.innerHTML='<div class="alert alert-danger">Demande introuvable ou erreur de chargement (ID: '+escapeHtml(rid)+').</div><button class="btn btn-outline mt-16" onclick="navigateTo(\'Dashboard\')">&larr; Retour</button>';
      return;
    }
    c.innerHTML = renderDetail(req);
  }).catch(function(error) {
    c.innerHTML='<div class="alert alert-danger">Erreur : '+escapeHtml(error.message)+'</div><button class="btn btn-outline mt-16" onclick="navigateTo(\'Dashboard\')">&larr; Retour</button>';
  });
}

function renderDetail(r) {
  var html = '<div class="mb-16"><button class="btn btn-outline btn-sm" onclick="navigateTo(\'Dashboard\')">&larr; Retour</button></div>';
  html += '<div class="card"><div class="card-header"><h2 class="card-title">Demande - '+escapeHtml(r.prenom+' '+r.nom)+'</h2>'+renderBadgeStatut(r.statut)+'</div>';
  html += renderTimelineStatut(r);
  html += '<hr style="margin:16px 0;border:none;border-top:1px solid var(--color-gray-200);">';
  html += '<div class="detail-grid">';
  html += buildDetailField('Matricule',r.matricule)+buildDetailField('Email',r.emailEmp)+buildDetailField('Poste',r.poste);
  html += buildDetailField('Departement',r.departement)+buildDetailField('Agence',r.agence||'Siege')+buildDetailField('Type de conge',r.typeConge);
  if (r.motif) html += buildDetailField('Motif',r.motif);
  html += buildDetailField('Date de debut',formatDateDisplay(r.dateDebut))+buildDetailField('Date de fin',formatDateDisplay(r.dateFin));
  html += buildDetailField('Nombre de jours',r.nbJours)+buildDetailField('Responsable',r.managerName+' ('+r.managerEmail+')');
  html += buildDetailField('Date de soumission',formatDateDisplay(r.dateSubmit));
  html += '</div></div>';

  if (r.commentManager||r.avisRh||r.commentRh||r.commentValidateur) {
    html += '<div class="card"><div class="card-header"><h3 class="card-title">Commentaires et avis</h3></div>';
    if (r.commentManager) { html += '<div class="mb-16"><div class="detail-label">Commentaire du responsable</div><div class="detail-value">'+escapeHtml(r.commentManager)+'</div>'; if (r.dateApprobation) html += '<div class="text-sm text-muted">'+formatDateDisplay(r.dateApprobation)+'</div>'; html += '</div>'; }
    if (r.avisRh) { html += '<div class="mb-16"><div class="detail-label">Avis RH</div><div class="detail-value"><span style="color:var(--color-'+(r.avisRh==='Favorable'?'success':'danger')+');font-weight:600;">'+escapeHtml(r.avisRh)+'</span></div>'; if (r.commentRh) html += '<div class="text-sm mt-8">'+escapeHtml(r.commentRh)+'</div>'; if (r.dateAvisRh) html += '<div class="text-sm text-muted">'+formatDateDisplay(r.dateAvisRh)+'</div>'; html += '</div>'; }
    if (r.commentValidateur) { html += '<div class="mb-16"><div class="detail-label">Commentaire du validateur final</div><div class="detail-value">'+escapeHtml(r.commentValidateur)+'</div>'; if (r.dateDecisionFinale) html += '<div class="text-sm text-muted">'+formatDateDisplay(r.dateDecisionFinale)+'</div>'; html += '</div>'; }
    html += '</div>';
  }

  if (r.statut==='Valide' && r.pdfUrl) {
    html += '<div class="card"><div class="card-header"><h3 class="card-title">Document</h3></div><a href="'+escapeHtml(r.pdfUrl)+'" target="_blank" class="btn btn-primary">Telecharger le PDF de conge</a></div>';
  }

  if (r.availableActions && r.availableActions.length > 0) {
    var btnCfg = {'APPROVE_N1':{l:'Approuver',c:'btn-success'},'REJECT_N1':{l:'Rejeter',c:'btn-danger'},'AVIS_FAVORABLE':{l:'Valider (RH)',c:'btn-success'},'AVIS_DEFAVORABLE':{l:'Rejeter (RH)',c:'btn-danger'},'ANNULER':{l:'Annuler ma demande',c:'btn-outline'}};
    html += '<div class="card"><div class="card-header"><h3 class="card-title">Actions disponibles</h3></div><div style="display:flex;gap:8px;flex-wrap:wrap;">';
    for (var i = 0; i < r.availableActions.length; i++) {
      var a = r.availableActions[i], bc = btnCfg[a]||{l:a,c:'btn-outline'};
      html += '<button class="btn '+bc.c+'" onclick="showActionModal(\''+a+'\',\''+escapeHtml(r.requestId)+'\')">'+bc.l+'</button>';
    }
    html += '</div></div>';
  }
  return html;
}

// =============================================================
// CALENDRIER EQUIPE
// =============================================================
var CalendarState = { year: new Date().getFullYear(), month: new Date().getMonth() + 1, absences: [] };

function loadCalendrierEquipe() {
  renderCalendrierEquipe(document.getElementById('app-content'));
}

function renderCalendrierEquipe(c) {
  var y = CalendarState.year, m = CalendarState.month;
  var monthNames = ['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];

  var html = '<div class="card"><div class="card-header">';
  html += '<h2 class="card-title">Calendrier des absences</h2>';
  html += '<div class="flex gap-8" style="align-items:center;">';
  html += '<button class="btn btn-outline btn-sm" onclick="calendarNav(-1)">&larr;</button>';
  html += '<span style="font-weight:600;min-width:160px;text-align:center;">' + monthNames[m-1] + ' ' + y + '</span>';
  html += '<button class="btn btn-outline btn-sm" onclick="calendarNav(1)">&rarr;</button>';
  html += '</div></div>';
  html += '<div id="calendar-content"><div style="text-align:center;padding:40px;"><div class="spinner"></div></div></div></div>';
  c.innerHTML = html;

  serverCall('server_getTeamCalendar', [y, m]).then(function(absences) {
    CalendarState.absences = absences || [];
    document.getElementById('calendar-content').innerHTML = renderCalendarBody(y, m, CalendarState.absences);
  }).catch(function(err) {
    document.getElementById('calendar-content').innerHTML = '<div class="alert alert-danger">' + escapeHtml(err.message) + '</div>';
  });
}

function calendarNav(delta) {
  CalendarState.month += delta;
  if (CalendarState.month > 12) { CalendarState.month = 1; CalendarState.year++; }
  if (CalendarState.month < 1) { CalendarState.month = 12; CalendarState.year--; }
  renderCalendrierEquipe(document.getElementById('app-content'));
}

function renderCalendarBody(year, month, absences) {
  var daysInMonth = new Date(year, month, 0).getDate();
  var firstDow = (new Date(year, month - 1, 1).getDay() + 6) % 7;
  var dayNames = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  var absMap = {};
  for (var i = 0; i < absences.length; i++) {
    var a = absences[i];
    var start = parseClientDate(a.dateDebut);
    var end = parseClientDate(a.dateFin);
    if (!start || !end) continue;
    var cur = new Date(Math.max(start.getTime(), new Date(year, month-1, 1).getTime()));
    var last = new Date(Math.min(end.getTime(), new Date(year, month-1, daysInMonth).getTime()));
    while (cur <= last) {
      var dn = cur.getDate();
      if (!absMap[dn]) absMap[dn] = [];
      absMap[dn].push(a);
      cur.setDate(cur.getDate() + 1);
    }
  }

  var html = '<div class="calendar-grid">';
  for (var d = 0; d < 7; d++) html += '<div class="calendar-header">' + dayNames[d] + '</div>';
  for (var e = 0; e < firstDow; e++) html += '<div class="calendar-cell calendar-empty"></div>';

  for (var day = 1; day <= daysInMonth; day++) {
    var dow = (firstDow + day - 1) % 7;
    var isWe = dow >= 5;
    var dayAbs = absMap[day] || [];
    html += '<div class="calendar-cell' + (isWe ? ' calendar-weekend' : '') + (dayAbs.length > 0 ? ' calendar-has-absence' : '') + '">';
    html += '<div class="calendar-day-num">' + day + '</div>';
    var shown = Math.min(dayAbs.length, 2);
    for (var j = 0; j < shown; j++) {
      html += '<div class="calendar-absence" title="' + escapeHtml(dayAbs[j].prenom + ' ' + dayAbs[j].nom + ' - ' + dayAbs[j].typeConge) + '">';
      html += escapeHtml(dayAbs[j].prenom.charAt(0) + '. ' + dayAbs[j].nom);
      html += '</div>';
    }
    if (dayAbs.length > 2) html += '<div class="calendar-more">+' + (dayAbs.length - 2) + '</div>';
    html += '</div>';
  }
  html += '</div>';

  if (absences.length > 0) {
    html += '<h3 class="mt-16 mb-8" style="font-size:1rem;color:var(--color-gray-700);">Detail des absences (' + absences.length + ')</h3>';
    html += '<div class="table-responsive"><table class="table"><thead><tr><th>Employe</th><th>Departement</th><th>Type</th><th>Du</th><th>Au</th><th>Statut</th></tr></thead><tbody>';
    for (var k = 0; k < absences.length; k++) {
      var ab = absences[k];
      html += '<tr><td><strong>' + escapeHtml(ab.prenom + ' ' + ab.nom) + '</strong></td>';
      html += '<td>' + escapeHtml(ab.departement) + '</td>';
      html += '<td>' + escapeHtml(ab.typeConge) + '</td>';
      html += '<td>' + escapeHtml(ab.dateDebut) + '</td>';
      html += '<td>' + escapeHtml(ab.dateFin) + '</td>';
      html += '<td>' + renderBadgeStatut(ab.statut) + '</td></tr>';
    }
    html += '</tbody></table></div>';
  } else {
    html += '<div class="table-empty"><div style="font-size:3rem;margin-bottom:12px;">&#128197;</div><p>Aucune absence ce mois-ci</p></div>';
  }
  return html;
}

function parseClientDate(str) {
  if (!str) return null;
  var parts = str.split('/');
  if (parts.length === 3) return new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
  parts = str.split('-');
  if (parts.length === 3) return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  return null;
}

function renderAnnuaire() {
  var html = '<div class="card"><div class="card-header"><h2 class="card-title">Annuaire du personnel</h2><span class="text-muted">' + AnnuaireState.employees.length + ' collaborateurs</span></div>';

  var depts = [];
  for (var i = 0; i < AnnuaireState.employees.length; i++) {
    var dept = AnnuaireState.employees[i].departement;

  html += '</select></div>';

function renderAnnuaireCards(emps) {
  if (emps.length === 0) return '<div class="table-empty"><p>Aucun collaborateur trouve</p></div>';
  var html = '';
  for (var i = 0; i < emps.length; i++) {
    var e = emps[i];
    var initials = ((e.prenom||'').charAt(0) + (e.nom||'').charAt(0)).toUpperCase();
    html += '<div class="annuaire-card">';
    html += '<div class="annuaire-avatar">' + escapeHtml(initials) + '</div>';
    html += '<div class="annuaire-info">';
    html += '<div class="annuaire-name">' + escapeHtml(e.prenom + ' ' + e.nom) + '</div>';
    html += '<div class="annuaire-poste">' + escapeHtml(e.poste) + '</div>';
    html += '<div class="annuaire-dept">' + escapeHtml(e.departement) + (e.agence ? ' - ' + escapeHtml(e.agence) : '') + '</div>';
    if (e.telephonePro) html += '<div class="annuaire-tel">' + escapeHtml(e.telephonePro) + '</div>';
    html += '<div class="annuaire-email">' + escapeHtml(e.email) + '</div>';
    html += '</div></div>';
  }
  return html;
}

function filterAnnuaire() {
  var q = (document.getElementById('annuaire-search').value || '').toLowerCase();
  var dept = document.getElementById('annuaire-dept').value;
  var filtered = AnnuaireState.employees.filter(function(e) {
    var matchText = !q || (e.nom + ' ' + e.prenom + ' ' + e.poste + ' ' + e.email + ' ' + e.matricule).toLowerCase().indexOf(q) !== -1;
    var matchDept = !dept || e.departement === dept;
    return matchText && matchDept;
  });
  document.getElementById('annuaire-grid').innerHTML = renderAnnuaireCards(filtered);
}

// ONBOARDING DETAIL (page)
// =============================================================
function loadOnboardingDetail(params) {
  var c = document.getElementById('app-content');
  var email = params ? params.email : null;
  if (!email) { c.innerHTML = '<div class="alert alert-danger">Email manquant.</div>'; return; }

  c.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';

  Promise.all([
    serverCall('server_getOnboardingSteps', email),
    serverCall('server_getFullProfile', email)
  ]).then(function(results) {
    var steps = results[0] || [];
    var profile = results[1];
    if (steps.length === 0) { c.innerHTML = '<div class="alert alert-info">Aucun onboarding en cours pour ' + escapeHtml(email) + '</div><button class="btn btn-outline mt-16" onclick="navigateTo(\'Administration\')">&larr; Retour</button>'; return; }

    var done = steps.filter(function(s) { return s.statut === 'Fait'; }).length;
    var pct = Math.round((done / steps.length) * 100);

    var html = '<div class="mb-16"><button class="btn btn-outline btn-sm" onclick="navigateTo(\'Administration\')">&larr; Retour</button></div>';
    html += '<div class="card"><div class="card-header"><h2 class="card-title">Onboarding - ' + escapeHtml(profile ? profile.prenom + ' ' + profile.nom : email) + '</h2>';
    html += '<span class="badge-statut ' + (pct === 100 ? 'badge-valide' : 'badge-soumis') + '">' + pct + '% complete</span></div>';

    if (profile) {
      html += '<div class="detail-grid mb-16">';
      html += buildDetailField('Poste', profile.poste) + buildDetailField('Departement', profile.departement);
      html += buildDetailField('Type de contrat', profile.typeContrat) + buildDetailField('Date d\'embauche', profile.dateEmbauche);
      html += '</div>';
    }

    html += '<div class="progress-bar mb-16"><div class="progress-fill" style="width:' + pct + '%;background:' + (pct < 50 ? 'var(--color-danger)' : pct < 80 ? 'var(--color-warning)' : 'var(--color-success)') + ';"></div></div>';

    html += '<div class="checklist">';
    for (var i = 0; i < steps.length; i++) {
      var s = steps[i];
      var icon = s.statut === 'Fait' ? '&#10003;' : s.statut === 'En cours' ? '&#9679;' : '&#9675;';
      var stClass = s.statut === 'Fait' ? 'checklist-done' : s.statut === 'En cours' ? 'checklist-progress' : 'checklist-todo';
      html += '<div class="checklist-item ' + stClass + '">';
      html += '<span class="checklist-icon">' + icon + '</span>';
      html += '<div class="checklist-content">';
      html += '<div class="checklist-label">' + escapeHtml(s.etapeLabel) + '</div>';
      if (s.dateCompletion) html += '<div class="text-sm text-muted">Termine le ' + escapeHtml(s.dateCompletion) + '</div>';
      if (s.commentaire) html += '<div class="text-sm text-muted">' + escapeHtml(s.commentaire) + '</div>';
      html += '</div>';
      html += '<div class="checklist-actions">';
      if (s.statut !== 'Fait') {
        if (s.statut === 'A faire') html += '<button class="btn btn-sm btn-outline" onclick="updateOnboardingStep(\'' + escapeHtml(s.onboardingId) + '\',\'En cours\',\'' + escapeHtml(email) + '\')">Demarrer</button>';
        html += '<button class="btn btn-sm btn-success" onclick="updateOnboardingStep(\'' + escapeHtml(s.onboardingId) + '\',\'Fait\',\'' + escapeHtml(email) + '\')">Valider</button>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';
    c.innerHTML = html;
  }).catch(function(err) {
    c.innerHTML = '<div class="alert alert-danger">' + escapeHtml(err.message) + '</div><button class="btn btn-outline mt-16" onclick="navigateTo(\'Administration\')">&larr; Retour</button>';
  });
}

function updateOnboardingStep(onboardingId, newStatut, email) {
  serverCall('server_updateOnboardingStep', [onboardingId, newStatut, '']).then(function() {
    showToast('Etape mise a jour', 'success');
    loadOnboardingDetail({email: email});

}

function showTerminateModal(contratId) {
  var html = '<h3 class="modal-title">Resilier le contrat</h3>';
  html += '<form id="form-terminate" onsubmit="submitTerminate(event,\'' + escapeHtml(contratId) + '\');return false;">';
  html += '<div class="form-group"><label class="form-label">Motif de resiliation *</label><textarea name="motif" class="form-textarea" required placeholder="Indiquez le motif..."></textarea></div>';
  html += '<div class="modal-actions"><button type="button" class="btn btn-outline" onclick="forceCloseModal()">Annuler</button>';
  html += '<button type="submit" class="btn btn-danger" id="btn-terminate">Resilier</button></div></form>';
  showModal(html);
}

function submitTerminate(event, contratId) {
  event.preventDefault();
  var motif = document.querySelector('#form-terminate [name="motif"]').value;
  var btn = document.getElementById('btn-terminate');
  btn.disabled = true; btn.textContent = 'Resiliation...';
  serverCall('server_terminateContract', [contratId, motif]).then(function() {
    forceCloseModal(); showToast('Contrat resilie', 'success'); adminLoadContrats();
  }).catch(function(err) { btn.disabled = false; btn.textContent = 'Resilier'; showToast('Erreur: ' + err.message, 'error'); });
}

function loadContractHistory() {
  var email = document.getElementById('contrat-hist-email').value.trim();
  if (!email) { showToast('Veuillez entrer un email', 'error'); return; }
  var ct = document.getElementById('contrat-history');
  ct.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spinner"></div></div>';
  serverCall('server_getEmployeeContracts', email).then(function(contrats) {
    if (!contrats || contrats.length === 0) { ct.innerHTML = '<div class="alert alert-info mt-16">Aucun contrat enregistre.</div>'; return; }
    var html = '<div class="table-responsive mt-16"><table class="table"><thead><tr><th>Type</th><th>Debut</th><th>Fin</th><th>Essai</th><th>Statut</th><th>Motif fin</th></tr></thead><tbody>';
    for (var i = 0; i < contrats.length; i++) {
      var c = contrats[i];
      var stClass = c.statut === 'Actif' ? 'badge-valide' : c.statut === 'Renouvele' ? 'badge-soumis' : 'badge-rejete-final';
      html += '<tr><td>' + escapeHtml(c.typeContrat) + '</td>';
      html += '<td>' + escapeHtml(c.dateDebut) + '</td>';
      html += '<td>' + escapeHtml(c.dateFin || 'Indetermine') + '</td>';
      html += '<td>' + escapeHtml(c.periodeEssaiFin || '-') + '</td>';
      html += '<td><span class="badge-statut ' + stClass + '">' + escapeHtml(c.statut) + '</span></td>';
      html += '<td>' + escapeHtml(c.motifFin || '-') + '</td></tr>';
    }
    html += '</tbody></table></div>';
    ct.innerHTML = html;
  }).catch(function(err) { ct.innerHTML = '<div class="alert alert-danger mt-16">' + escapeHtml(err.message) + '</div>'; });
}

// =============================================================
// DOCUMENTS / ATTESTATIONS (onglet Administration)
// =============================================================
function adminLoadDocuments() {
  var ct = document.getElementById('admin-tab-content');
  ct.innerHTML = '<div style="text-align:center;padding:20px;"><div class="spinner"></div></div>';

  Promise.all([
    serverCall('server_getAllDocumentRequests'),
    serverCall('server_getAllDocuments')
  ]).then(function(results) {
    var docRequests = results[0] || [];
    var docs = results[1] || [];

    var pending = docRequests.filter(function(r) { return r.statut === 'En attente' || r.statut === 'En cours'; });
    var html = '';

    if (pending.length > 0) {
      html += '<div class="card-header" style="padding:0 0 16px 0;"><h3 class="card-title">Demandes en attente de traitement</h3><span class="badge-count" style="font-size:0.9rem;min-width:24px;height:24px;">' + pending.length + '</span></div>';
      html += renderDocRequestsTable(pending, true);
      html += '<hr style="margin:24px 0;border:none;border-top:1px solid var(--color-gray-200);">';
    }

    if (docRequests.length > 0) {
      html += '<div class="card-header" style="padding:0 0 16px 0;"><h3 class="card-title">Toutes les demandes de documents</h3><span class="text-muted">' + docRequests.length + ' demandes</span></div>';
      html += renderDocRequestsTable(docRequests, true);
      html += '<hr style="margin:24px 0;border:none;border-top:1px solid var(--color-gray-200);">';
    }

    html += '<div class="card-header" style="padding:0 0 16px 0;"><h3 class="card-title">Documents generes</h3><button class="btn btn-primary btn-sm" onclick="showGenerateDocModal()" style="margin-left:auto;">+ Generer un document</button></div>';

    if (!docs || docs.length === 0) {
      html += '<div class="table-empty"><div style="font-size:3rem;margin-bottom:12px;">&#128220;</div><p>Aucun document genere</p></div>';
    } else {
      html += '<div class="table-responsive"><table class="table"><thead><tr>';
      html += '<th>Date</th><th>Employe</th><th>Type</th><th>Genere par</th><th>Notes</th><th>Action</th>';
      html += '</tr></thead><tbody>';
      for (var i = 0; i < docs.length; i++) {
        var d = docs[i];
        html += '<tr>';
        html += '<td>' + escapeHtml(d.dateGeneration) + '</td>';
        html += '<td><strong>' + escapeHtml((d.prenom || '') + ' ' + (d.nom || '')) + '</strong></td>';
        html += '<td><span class="badge-statut badge-approuve-n1">' + escapeHtml(d.typeDocument) + '</span></td>';
        html += '<td>' + escapeHtml(d.generePar) + '</td>';
        html += '<td>' + escapeHtml(d.notes || '-') + '</td>';
        html += '<td>';
        if (d.documentUrl) html += '<a href="' + escapeHtml(d.documentUrl) + '" target="_blank" class="btn btn-sm btn-outline">Telecharger</a>';
        html += '</td></tr>';
      }
      html += '</tbody></table></div>';
    }
    ct.innerHTML = html;
  }).catch(function(err) { ct.innerHTML = '<div class="alert alert-danger">' + escapeHtml(err.message) + '</div>'; });
}

function processDocRequest(demandeId, action) {
  var modalTitle = action === 'TRAITER' ? 'Traiter la demande' : 'Rejeter la demande';
  var btnText = action === 'TRAITER' ? 'Confirmer le traitement' : 'Confirmer le rejet';
  var btnClass = action === 'TRAITER' ? 'btn-success' : 'btn-danger';

  var html = '<h3 class="modal-title">' + modalTitle + '</h3>';
  html += '<div class="form-group"><label class="form-label">Notes RH' + (action === 'REJETER' ? ' (obligatoire)' : ' (optionnel)') + '</label>';
  html += '<textarea class="form-textarea" id="doc-req-notes" placeholder="Commentaire..."></textarea></div>';
  html += '<div class="modal-actions">';
  html += '<button class="btn btn-outline" onclick="forceCloseModal()">Annuler</button>';
  html += '<button class="btn ' + btnClass + '" id="btn-process-doc" onclick="confirmProcessDocRequest(\'' + escapeHtml(demandeId) + '\',\'' + action + '\')">' + btnText + '</button>';
  html += '</div>';
  showModal(html);
}

function confirmProcessDocRequest(demandeId, action) {
  var notes = document.getElementById('doc-req-notes').value.trim();
  if (action === 'REJETER' && !notes) { showToast('Les notes sont obligatoires pour un rejet', 'error'); return; }
  var btn = document.getElementById('btn-process-doc');
  btn.disabled = true; btn.textContent = 'Traitement...';
  serverCall('server_processDocumentRequest', [demandeId, action, notes]).then(function() {
    forceCloseModal();
    showToast('Demande traitee avec succes', 'success');
    if (App.currentPage === 'Administration') adminLoadDocuments();
    else if (App.currentPage === 'Dashboard') loadDashboard();
  }).catch(function(err) {
    btn.disabled = false; btn.textContent = 'Reessayer';
    showToast('Erreur: ' + err.message, 'error');
  });
}

function showGenerateDocModal() {
  var html = '<h3 class="modal-title">Generer un document RH</h3>';
  html += '<form id="form-gendoc" onsubmit="submitGenerateDoc(event);return false;">';
  html += '<div class="form-group"><label class="form-label">Email employe *</label><input type="email" name="emailEmp" class="form-input" required></div>';
  html += '<div class="form-group"><label class="form-label">Type de document *</label><select name="typeDocument" class="form-select" required>';
  html += '<option value="">-- Selectionner --</option>';
  var docTypes = ['Attestation de travail', 'Certificat de travail', 'Attestation de stage', 'Attestation de presence'];
  for (var i = 0; i < docTypes.length; i++) html += '<option value="' + docTypes[i] + '">' + docTypes[i] + '</option>';
  html += '</select></div>';
  html += '<div class="form-group"><label class="form-label">Notes (optionnel)</label><textarea name="notes" class="form-textarea" placeholder="Informations complementaires..."></textarea></div>';
  html += '<div class="modal-actions"><button type="button" class="btn btn-outline" onclick="forceCloseModal()">Annuler</button>';
  html += '<button type="submit" class="btn btn-primary" id="btn-gendoc">Generer le document</button></div></form>';
  showModal(html);
}

function submitGenerateDoc(event) {
  event.preventDefault();
  var f = document.getElementById('form-gendoc');
  var emailEmp = f.querySelector('[name="emailEmp"]').value;
  var typeDocument = f.querySelector('[name="typeDocument"]').value;
  var notes = f.querySelector('[name="notes"]').value;
  if (!emailEmp || !typeDocument) { showToast('Email et type requis', 'error'); return; }

  var btn = document.getElementById('btn-gendoc');
  btn.disabled = true; btn.textContent = 'Generation en cours...';
  serverCall('server_generateDocument', [emailEmp, typeDocument, notes]).then(function(res) {
    forceCloseModal();
    showToast('Document genere avec succes', 'success');
    if (res && res.url) window.open(res.url, '_blank');
    adminLoadDocuments();
  }).catch(function(err) { btn.disabled = false; btn.textContent = 'Generer le document'; showToast('Erreur: ' + err.message, 'error'); });
}
</script>
