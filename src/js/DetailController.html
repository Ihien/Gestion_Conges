<script>
/**
 * DetailController.html - Affichage detail d'une demande et actions
 */

function DetailController_load(requestId) {
  var content = document.getElementById('app-content');

  if (!requestId) {
    content.innerHTML = '<div class="alert alert-danger">Identifiant de demande manquant.</div>';
    return;
  }

  serverCall('server_getRequestById', requestId)
    .then(function(request) {
      content.innerHTML = DetailController_render(request);
    })
    .catch(function(error) {
      content.innerHTML = '<div class="alert alert-danger">Erreur : ' + escapeHtml(error.message) + '</div>' +
        '<button class="btn btn-outline mt-16" onclick="navigateTo(\'Dashboard\')">Retour au tableau de bord</button>';
    });
}

function DetailController_render(request) {
  var html = '';

  // Bouton retour
  html += '<div class="mb-16">';
  html += '<button class="btn btn-outline btn-sm" onclick="navigateTo(\'Dashboard\')">&larr; Retour</button>';
  html += '</div>';

  // Carte principale
  html += '<div class="card">';
  html += '<div class="card-header">';
  html += '<h2 class="card-title">Demande de conge - ' + escapeHtml(request.prenom + ' ' + request.nom) + '</h2>';
  html += renderBadgeStatut(request.statut);
  html += '</div>';

  // Timeline
  html += renderTimelineStatut(request);

  html += '<hr style="margin:16px 0;border:none;border-top:1px solid var(--color-gray-200);">';

  // Informations
  html += '<div class="detail-grid">';
  html += buildDetailField('Matricule', request.matricule);
  html += buildDetailField('Email', request.emailEmp);
  html += buildDetailField('Poste', request.poste);
  html += buildDetailField('Departement', request.departement);
  html += buildDetailField('Agence', request.agence || 'Siege');
  html += buildDetailField('Type de conge', request.typeConge);

  if (request.motif) {
    html += buildDetailField('Motif', request.motif);
  }

  html += buildDetailField('Date de debut', formatDateDisplay(request.dateDebut));
  html += buildDetailField('Date de fin', formatDateDisplay(request.dateFin));
  html += buildDetailField('Nombre de jours', request.nbJours);
  html += buildDetailField('Responsable', request.managerName + ' (' + request.managerEmail + ')');
  html += buildDetailField('Date de soumission', formatDateDisplay(request.dateSubmit));
  html += '</div>';

  html += '</div>'; // Fin carte principale

  // Carte commentaires et avis
  if (request.commentManager || request.avisRh || request.commentRh || request.commentValidateur) {
    html += '<div class="card">';
    html += '<div class="card-header"><h3 class="card-title">Commentaires et avis</h3></div>';

    if (request.commentManager) {
      html += '<div class="mb-16">';
      html += '<div class="detail-label">Commentaire du responsable</div>';
      html += '<div class="detail-value">' + escapeHtml(request.commentManager) + '</div>';
      if (request.dateApprobation) {
        html += '<div class="text-sm text-muted">' + formatDateDisplay(request.dateApprobation) + '</div>';
      }
      html += '</div>';
    }

    if (request.avisRh) {
      html += '<div class="mb-16">';
      html += '<div class="detail-label">Avis RH</div>';
      html += '<div class="detail-value">';
      if (request.avisRh === 'Favorable') {
        html += '<span style="color:var(--color-success);font-weight:600;">Favorable</span>';
      } else {
        html += '<span style="color:var(--color-danger);font-weight:600;">Defavorable</span>';
      }
      html += '</div>';
      if (request.commentRh) {
        html += '<div class="text-sm" style="margin-top:4px;">' + escapeHtml(request.commentRh) + '</div>';
      }
      if (request.dateAvisRh) {
        html += '<div class="text-sm text-muted">' + formatDateDisplay(request.dateAvisRh) + '</div>';
      }
      html += '</div>';
    }

    if (request.commentValidateur) {
      html += '<div class="mb-16">';
      html += '<div class="detail-label">Commentaire du validateur final</div>';
      html += '<div class="detail-value">' + escapeHtml(request.commentValidateur) + '</div>';
      if (request.dateDecisionFinale) {
        html += '<div class="text-sm text-muted">' + formatDateDisplay(request.dateDecisionFinale) + '</div>';
      }
      html += '</div>';
    }

    html += '</div>'; // Fin carte commentaires
  }

  // Carte PDF si valide
  if (request.statut === 'Valide' && request.pdfUrl) {
    html += '<div class="card">';
    html += '<div class="card-header"><h3 class="card-title">Document</h3></div>';
    html += '<a href="' + escapeHtml(request.pdfUrl) + '" target="_blank" class="btn btn-primary">';
    html += 'Telecharger le PDF de conge';
    html += '</a>';
    html += '</div>';
  }

  // Carte actions
  if (request.availableActions && request.availableActions.length > 0) {
    html += '<div class="card">';
    html += '<div class="card-header"><h3 class="card-title">Actions disponibles</h3></div>';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';

    for (var i = 0; i < request.availableActions.length; i++) {
      var action = request.availableActions[i];
      var btnConfig = getActionButtonConfig(action);
      html += '<button class="btn ' + btnConfig.btnClass + '" onclick="showActionModal(\'' + action + '\', \'' + escapeHtml(request.requestId) + '\')">';
      html += btnConfig.label;
      html += '</button>';
    }

    html += '</div>';
    html += '</div>';
  }

  return html;
}

function getActionButtonConfig(actionKey) {
  var configs = {
    'APPROVE_N1': { label: 'Approuver', btnClass: 'btn-success' },
    'REJECT_N1': { label: 'Rejeter', btnClass: 'btn-danger' },
    'AVIS_FAVORABLE': { label: 'Avis Favorable', btnClass: 'btn-success' },
    'AVIS_DEFAVORABLE': { label: 'Avis Defavorable', btnClass: 'btn-warning' },
    'VALIDER': { label: 'Valider (Decision finale)', btnClass: 'btn-success' },
    'REJETER_FINAL': { label: 'Rejeter (Decision finale)', btnClass: 'btn-danger' },
    'ANNULER': { label: 'Annuler ma demande', btnClass: 'btn-outline' }
  };
  return configs[actionKey] || { label: actionKey, btnClass: 'btn-outline' };
}
</script>
