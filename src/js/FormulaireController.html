<script>
/**
 * FormulaireController.html - Logique du formulaire de demande
 */

function FormulaireController_load() {
  var p = App.userProfile;
  var content = document.getElementById('app-content');

  var html = '<div class="card">';
  html += '<div class="card-header"><h2 class="card-title">Nouvelle demande de conge</h2></div>';

  html += '<form id="form-demande" onsubmit="FormulaireController_submit(event); return false;">';

  // Informations employe (pre-remplies)
  html += '<h3 class="mb-8" style="font-size:1rem;color:var(--color-gray-700);">Informations de l\'employe</h3>';
  html += '<div class="form-row">';
  html += buildFormField('Matricule', 'matricule', 'text', p.matricule, false, 'M0001');
  html += buildFormField('Nom', 'nom', 'text', p.nom, true);
  html += '</div>';
  html += '<div class="form-row">';
  html += buildFormField('Prenom', 'prenom', 'text', p.prenom, true);
  html += buildFormField('Poste', 'poste', 'text', p.poste, true);
  html += '</div>';

  // Departement
  html += '<div class="form-row">';
  html += '<div class="form-group">';
  html += '<label class="form-label">Departement</label>';
  html += '<input type="text" name="departement" class="form-input form-readonly" value="' + escapeHtml(p.departement) + '" readonly>';
  html += '</div>';

  // Agence
  html += '<div class="form-group" id="agence-group">';
  html += '<label class="form-label">Agence</label>';
  html += '<input type="text" name="agence" class="form-input form-readonly" value="' + escapeHtml(p.agence || 'Siege') + '" readonly>';
  html += '</div>';
  html += '</div>';

  // Details du conge
  html += '<hr style="margin:20px 0;border:none;border-top:1px solid var(--color-gray-200);">';
  html += '<h3 class="mb-8" style="font-size:1rem;color:var(--color-gray-700);">Details du conge</h3>';

  // Type de conge
  html += '<div class="form-row">';
  html += '<div class="form-group">';
  html += '<label class="form-label">Type de conge *</label>';
  html += '<select name="typeConge" class="form-select" onchange="FormulaireController_onTypeChange(this.value)">';
  html += '<option value="">-- Selectionner --</option>';
  html += '<option value="Conges payes">Conges payes</option>';
  html += '<option value="Absence exceptionnelle">Absence exceptionnelle</option>';
  html += '</select>';
  html += '</div>';

  // Solde actuel
  html += '<div class="form-group">';
  html += '<label class="form-label">Solde actuel</label>';
  html += '<div class="stat-card" style="padding:8px;text-align:center;">';
  html += '<span class="stat-value" style="font-size:1.5rem;" id="form-solde">' + (p.soldeConges || 0) + '</span>';
  html += '<span class="stat-label"> jours</span>';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  // Motif (conditionnel)
  html += '<div class="form-group hidden" id="motif-group">';
  html += '<label class="form-label">Motif *</label>';
  html += '<textarea name="motif" class="form-textarea" placeholder="Precisez le motif de l\'absence exceptionnelle..."></textarea>';
  html += '</div>';

  // Dates
  html += '<div class="form-row">';
  html += '<div class="form-group">';
  html += '<label class="form-label">Date de debut *</label>';
  html += '<input type="date" name="dateDebut" class="form-input" onchange="FormulaireController_calculateDays()">';
  html += '</div>';
  html += '<div class="form-group">';
  html += '<label class="form-label">Date de fin *</label>';
  html += '<input type="date" name="dateFin" class="form-input" onchange="FormulaireController_calculateDays()">';
  html += '</div>';
  html += '</div>';

  // Nombre de jours
  html += '<div class="form-group">';
  html += '<label class="form-label">Nombre de jours ouvres</label>';
  html += '<div id="nb-jours-display" class="alert alert-info" style="display:inline-block;padding:8px 16px;">Selectionnez les dates</div>';
  html += '<input type="hidden" name="nbJours" value="0">';
  html += '</div>';

  // Manager
  html += '<div class="form-group">';
  html += '<label class="form-label">Responsable hierarchique</label>';
  html += '<input type="text" class="form-input form-readonly" value="' + escapeHtml(p.managerEmail || 'Non defini') + '" readonly>';
  html += '</div>';

  // Boutons
  html += '<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px;">';
  html += '<button type="button" class="btn btn-outline" onclick="navigateTo(\'Dashboard\')">Annuler</button>';
  html += '<button type="submit" class="btn btn-primary btn-lg" id="btn-submit">Soumettre la demande</button>';
  html += '</div>';

  html += '</form>';
  html += '</div>';

  content.innerHTML = html;
}

function buildFormField(label, name, type, value, readonly, placeholder) {
  var html = '<div class="form-group">';
  html += '<label class="form-label">' + label + (readonly ? '' : ' *') + '</label>';
  html += '<input type="' + type + '" name="' + name + '" class="form-input' + (readonly ? ' form-readonly' : '') + '"';
  html += ' value="' + escapeHtml(value || '') + '"';
  if (readonly) html += ' readonly';
  if (placeholder) html += ' placeholder="' + placeholder + '"';
  html += '>';
  html += '</div>';
  return html;
}

function FormulaireController_onTypeChange(value) {
  var motifGroup = document.getElementById('motif-group');
  if (value === 'Absence exceptionnelle') {
    motifGroup.classList.remove('hidden');
  } else {
    motifGroup.classList.add('hidden');
  }
}

function FormulaireController_calculateDays() {
  var dateDebut = document.querySelector('[name="dateDebut"]').value;
  var dateFin = document.querySelector('[name="dateFin"]').value;
  var display = document.getElementById('nb-jours-display');
  var hiddenInput = document.querySelector('[name="nbJours"]');

  if (!dateDebut || !dateFin) {
    display.textContent = 'Selectionnez les dates';
    display.className = 'alert alert-info';
    hiddenInput.value = '0';
    return;
  }

  display.textContent = 'Calcul en cours...';

  serverCall('server_calculateBusinessDays', [dateDebut, dateFin])
    .then(function(nbJours) {
      hiddenInput.value = nbJours;
      if (nbJours > 0) {
        display.textContent = nbJours + ' jour' + (nbJours > 1 ? 's' : '') + ' ouvre' + (nbJours > 1 ? 's' : '');
        display.className = 'alert alert-success';

        // Verifier le solde
        var typeConge = document.querySelector('[name="typeConge"]').value;
        if (typeConge === 'Conges payes' && nbJours > (App.userProfile.soldeConges || 0)) {
          display.textContent += ' (ATTENTION: solde insuffisant!)';
          display.className = 'alert alert-danger';
        }
      } else {
        display.textContent = 'Aucun jour ouvre dans cette periode';
        display.className = 'alert alert-warning';
      }
    })
    .catch(function() {
      display.textContent = 'Erreur de calcul';
      display.className = 'alert alert-danger';
    });
}

function FormulaireController_submit(event) {
  event.preventDefault();
  ValidationFormulaire.clearErrors();

  var form = document.getElementById('form-demande');
  var formData = {
    matricule: form.querySelector('[name="matricule"]').value,
    nom: form.querySelector('[name="nom"]').value,
    prenom: form.querySelector('[name="prenom"]').value,
    poste: form.querySelector('[name="poste"]').value,
    departement: form.querySelector('[name="departement"]').value,
    agence: App.userProfile.agence || '',
    typeConge: form.querySelector('[name="typeConge"]').value,
    motif: form.querySelector('[name="motif"]') ? form.querySelector('[name="motif"]').value : '',
    dateDebut: form.querySelector('[name="dateDebut"]').value,
    dateFin: form.querySelector('[name="dateFin"]').value,
    nbJours: parseInt(form.querySelector('[name="nbJours"]').value) || 0,
    soldeActuel: App.userProfile.soldeConges || 0
  };

  // Validation client
  var validation = ValidationFormulaire.validateDemandeForm(formData);
  if (!validation.valid) {
    ValidationFormulaire.showErrors(validation.errors);
    return;
  }

  // Desactiver le bouton
  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  serverCall('server_submitRequest', formData)
    .then(function(result) {
      showToast('Demande soumise avec succes !', 'success');
      loadPendingCount();
      navigateTo('Dashboard');
    })
    .catch(function(error) {
      showToast('Erreur: ' + error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Soumettre la demande';
    });
}
</script>
