<script>
/**
 * App.html - Etat global, routeur, wrapper google.script.run
 */

// ===== ETAT GLOBAL =====
var App = {
  currentPage: null,
  userProfile: null,
  loading: false
};

// ===== INITIALISATION =====
document.addEventListener('DOMContentLoaded', function() {
  App.userProfile = APP_USER_PROFILE;
  updateNavbar(App.userProfile);
  navigateTo(APP_INITIAL_PAGE, APP_PAGE_PARAMS);
  loadPendingCount();
  hideLoading();
});

// ===== NAVIGATION / ROUTEUR =====
function navigateTo(pageName, params) {
  if (App.loading) return;

  App.currentPage = pageName;
  updateActiveNavLink(pageName);

  var contentDiv = document.getElementById('app-content');
  contentDiv.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p class="text-muted mt-8">Chargement...</p></div>';

  // Charger la page selon le nom
  switch (pageName) {
    case 'Dashboard':
      loadDashboard();
      break;
    case 'NouvelDemande':
      loadNouvelDemande();
      break;
    case 'DetailDemande':
      loadDetailDemande(params);
      break;
    case 'MonProfil':
      loadMonProfil();
      break;
    case 'Administration':
      loadAdministration();
      break;
    default:
      contentDiv.innerHTML = '<div class="alert alert-danger">Page non trouvee : ' + pageName + '</div>';
  }

  // Mettre a jour l'URL
  try {
    var stateObj = { page: pageName };
    if (params) stateObj.params = params;
    google.script.history.push(stateObj, { page: pageName });
  } catch (e) {
    // Ignorer les erreurs de history
  }
}

// Gerer le bouton retour du navigateur
try {
  google.script.history.setChangeHandler(function(e) {
    if (e && e.state && e.state.page) {
      navigateTo(e.state.page, e.state.params);
    }
  });
} catch (e) {}

// ===== WRAPPER GOOGLE.SCRIPT.RUN =====
function serverCall(functionName, args) {
  return new Promise(function(resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(error) {
        reject(error);
      });

    // Appeler la fonction avec les arguments
    if (args === undefined) {
      runner[functionName]();
    } else if (Array.isArray(args)) {
      runner[functionName].apply(runner, args);
    } else {
      runner[functionName](args);
    }
  });
}

// ===== PENDING COUNT =====
function loadPendingCount() {
  serverCall('server_getPendingForMe')
    .then(function(requests) {
      updatePendingCount(requests ? requests.length : 0);
    })
    .catch(function() {
      // Ignorer silencieusement
    });
}

// ===== LOADING =====
function showLoading() {
  document.getElementById('loading-overlay').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loading-overlay').classList.add('hidden');
}

// ===== TOAST NOTIFICATIONS =====
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(function() {
    if (toast.parentNode) {
      toast.parentNode.removeChild(toast);
    }
  }, 4000);
}

// ===== MODAL =====
function showModal(htmlContent) {
  document.getElementById('modal-content').innerHTML = htmlContent;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.add('hidden');
}

function forceCloseModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

// ===== UTILITAIRES =====
function formatDateDisplay(dateStr) {
  if (!dateStr) return '-';
  if (dateStr instanceof Date || (typeof dateStr === 'string' && dateStr.indexOf('T') !== -1)) {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    var day = d.getDate().toString().padStart(2, '0');
    var month = (d.getMonth() + 1).toString().padStart(2, '0');
    var year = d.getFullYear();
    return day + '/' + month + '/' + year;
  }
  return dateStr;
}

function getStatusBadgeClass(statut) {
  var classes = {
    'Soumis': 'badge-soumis',
    'Approuve N1': 'badge-approuve-n1',
    'Rejete N1': 'badge-rejete-n1',
    'Avis RH Favorable': 'badge-avis-rh-favorable',
    'Avis RH Defavorable': 'badge-avis-rh-defavorable',
    'Valide': 'badge-valide',
    'Rejete Final': 'badge-rejete-final',
    'Annule': 'badge-annule'
  };
  return classes[statut] || 'badge-soumis';
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

// ===== PLACEHOLDER PAGE LOADERS (implementes dans les controllers) =====
function loadDashboard() {
  var content = document.getElementById('app-content');
  content.innerHTML = '<div class="card"><div class="card-header"><h2 class="card-title">Tableau de bord</h2></div><p class="text-muted">Chargement du tableau de bord...</p></div>';
  if (typeof DashboardController_load === 'function') {
    DashboardController_load();
  }
}

function loadNouvelDemande() {
  var content = document.getElementById('app-content');
  content.innerHTML = '<div class="card"><div class="card-header"><h2 class="card-title">Nouvelle demande</h2></div><p class="text-muted">Chargement du formulaire...</p></div>';
  if (typeof FormulaireController_load === 'function') {
    FormulaireController_load();
  }
}

function loadDetailDemande(params) {
  var content = document.getElementById('app-content');
  content.innerHTML = '<div class="card"><p class="text-muted">Chargement de la demande...</p></div>';
  if (typeof DetailController_load === 'function') {
    var requestId = params ? (params.id || params.requestId) : null;
    DetailController_load(requestId);
  }
}

function loadMonProfil() {
  var content = document.getElementById('app-content');
  content.innerHTML = buildMonProfilPage();
}

function loadAdministration() {
  var content = document.getElementById('app-content');
  content.innerHTML = '<div class="card"><div class="card-header"><h2 class="card-title">Administration</h2></div><p class="text-muted">Chargement...</p></div>';
  if (typeof AdminController_load === 'function') {
    AdminController_load();
  }
}

// ===== MON PROFIL (inline car simple) =====
function buildMonProfilPage() {
  var p = App.userProfile;
  if (!p) return '<div class="alert alert-danger">Profil non disponible</div>';

  var roleLabels = {
    'EMPLOYE': 'Employe',
    'CHEF_AGENCE': 'Chef d\'Agence',
    'CHEF_DEPARTEMENT': 'Chef de Departement',
    'RH': 'Ressources Humaines',
    'DIRECTEUR_CLIENTELE': 'Directeur Clientele',
    'DIRECTEUR_GENERAL': 'Directeur General'
  };

  var html = '<div class="card">';
  html += '<div class="card-header"><h2 class="card-title">Mon Profil</h2></div>';
  html += '<div class="detail-grid">';
  html += buildDetailField('Nom', p.nom);
  html += buildDetailField('Prenom', p.prenom);
  html += buildDetailField('Email', p.email);
  html += buildDetailField('Matricule', p.matricule);
  html += buildDetailField('Poste', p.poste);
  html += buildDetailField('Departement', p.departement);
  html += buildDetailField('Agence', p.agence || 'Siege');
  html += buildDetailField('Role', roleLabels[p.role] || p.role);
  html += '</div>';
  html += '</div>';

  // Carte solde conges
  html += '<div class="card">';
  html += '<div class="card-header"><h2 class="card-title">Solde de Conges</h2></div>';
  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-value" id="profil-solde">' + (p.soldeConges || 0) + '</div><div class="stat-label">Jours restants</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + (p.soldeInitial || 30) + '</div><div class="stat-label">Allocation annuelle</div></div>';
  html += '</div>';
  html += '</div>';

  return html;
}

function buildDetailField(label, value) {
  return '<div class="detail-field"><div class="detail-label">' + escapeHtml(label) + '</div><div class="detail-value">' + escapeHtml(value || '-') + '</div></div>';
}
</script>
