<script>
/**
 * DashboardController.html - Logique du tableau de bord
 */

var DashboardState = {
  myRequests: [],
  pendingRequests: [],
  teamRequests: [],
  filter: 'all'
};

function DashboardController_load() {
  var content = document.getElementById('app-content');
  var role = App.userProfile.role;

  content.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>';

  // Charger les donnees en parallele
  var promises = [
    serverCall('server_getMyRequests'),
    serverCall('server_getPendingForMe')
  ];

  // Charger les demandes equipe pour les managers et RH
  if (role !== 'EMPLOYE') {
    promises.push(serverCall('server_getTeamRequests'));
  }

  Promise.all(promises)
    .then(function(results) {
      DashboardState.myRequests = results[0] || [];
      DashboardState.pendingRequests = results[1] || [];
      DashboardState.teamRequests = results[2] || [];
      content.innerHTML = DashboardController_render();
    })
    .catch(function(error) {
      content.innerHTML = '<div class="alert alert-danger">Erreur de chargement : ' + escapeHtml(error.message) + '</div>';
    });
}

function DashboardController_render() {
  var html = '';
  var role = App.userProfile.role;
  var p = App.userProfile;

  // Stats
  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-value">' + (p.soldeConges || 0) + '</div><div class="stat-label">Jours de conge restants</div></div>';
  html += '<div class="stat-card"><div class="stat-value">' + DashboardState.myRequests.length + '</div><div class="stat-label">Mes demandes</div></div>';

  if (DashboardState.pendingRequests.length > 0) {
    html += '<div class="stat-card" style="border-left:4px solid var(--color-warning);">';
    html += '<div class="stat-value" style="color:var(--color-warning);">' + DashboardState.pendingRequests.length + '</div>';
    html += '<div class="stat-label">En attente de mon action</div></div>';
  }

  if (role !== 'EMPLOYE') {
    html += '<div class="stat-card"><div class="stat-value">' + DashboardState.teamRequests.length + '</div><div class="stat-label">Demandes equipe</div></div>';
  }
  html += '</div>';

  // Bouton nouvelle demande
  html += '<div class="mb-16">';
  html += '<button class="btn btn-primary btn-lg" onclick="navigateTo(\'NouvelDemande\')">+ Nouvelle demande de conge</button>';
  html += '</div>';

  // Demandes en attente d'action
  if (DashboardState.pendingRequests.length > 0) {
    html += '<div class="card">';
    html += '<div class="card-header">';
    html += '<h2 class="card-title">En attente de mon action</h2>';
    html += '<span class="badge-count" style="font-size:0.9rem;min-width:24px;height:24px;">' + DashboardState.pendingRequests.length + '</span>';
    html += '</div>';
    html += renderTableDemandes(DashboardState.pendingRequests, { showEmployee: true });
    html += '</div>';
  }

  // Mes demandes
  html += '<div class="card">';
  html += '<div class="card-header">';
  html += '<h2 class="card-title">Mes demandes</h2>';
  html += '</div>';

  // Filtres
  html += '<div class="filters-bar">';
  html += '<div class="filter-pills">';
  html += '<span class="filter-pill active" data-filter="all" onclick="DashboardController_filter(\'all\', this)">Toutes</span>';
  html += '<span class="filter-pill" data-filter="Soumis" onclick="DashboardController_filter(\'Soumis\', this)">Soumises</span>';
  html += '<span class="filter-pill" data-filter="en_cours" onclick="DashboardController_filter(\'en_cours\', this)">En cours</span>';
  html += '<span class="filter-pill" data-filter="Valide" onclick="DashboardController_filter(\'Valide\', this)">Validees</span>';
  html += '<span class="filter-pill" data-filter="rejete" onclick="DashboardController_filter(\'rejete\', this)">Rejetees</span>';
  html += '</div>';
  html += '</div>';

  html += '<div id="my-requests-table">';
  html += renderTableDemandes(DashboardState.myRequests, { showEmployee: false });
  html += '</div>';
  html += '</div>';

  // Demandes equipe (pour managers)
  if (role !== 'EMPLOYE' && DashboardState.teamRequests.length > 0) {
    html += '<div class="card">';
    html += '<div class="card-header">';
    html += '<h2 class="card-title">Demandes de l\'equipe</h2>';
    html += '</div>';
    html += renderTableDemandes(DashboardState.teamRequests, { showEmployee: true });
    html += '</div>';
  }

  return html;
}

function DashboardController_filter(filter, element) {
  // Mettre a jour les pills actives
  var pills = document.querySelectorAll('.filter-pill');
  for (var i = 0; i < pills.length; i++) {
    pills[i].classList.remove('active');
  }
  element.classList.add('active');

  // Filtrer les demandes
  var filtered;
  if (filter === 'all') {
    filtered = DashboardState.myRequests;
  } else if (filter === 'en_cours') {
    filtered = DashboardState.myRequests.filter(function(r) {
      return r.statut === 'Approuve N1' || r.statut === 'Avis RH Favorable' || r.statut === 'Avis RH Defavorable';
    });
  } else if (filter === 'rejete') {
    filtered = DashboardState.myRequests.filter(function(r) {
      return r.statut === 'Rejete N1' || r.statut === 'Rejete Final';
    });
  } else {
    filtered = DashboardState.myRequests.filter(function(r) {
      return r.statut === filter;
    });
  }

  var tableContainer = document.getElementById('my-requests-table');
  tableContainer.innerHTML = renderTableDemandes(filtered, { showEmployee: false });
}
</script>
