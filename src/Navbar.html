<script>
function toggleNav() {
  document.getElementById('navbar-nav').classList.toggle('open');
}

function updateNavbar(profile) {
  if (!profile) return;
  document.getElementById('user-name').textContent = profile.prenom + ' ' + profile.nom;
  var roleLabels = {'EMPLOYE':'Employe','CHEF_AGENCE':'Chef Agence','CHEF_AGENCE_SENIOR':'Chef Agence Sr.','CHEF_DEPARTEMENT':'Chef Dept.','RH':'RH','DIRECTEUR_CLIENTELE':'Dir. Clientele','DIRECTEUR_GENERAL':'Dir. General'};
  document.getElementById('user-role-badge').textContent = roleLabels[profile.role] || profile.role;
  if (profile.role === 'RH' || profile.role === 'DIRECTEUR_GENERAL') {
    document.getElementById('nav-admin').classList.remove('hidden');
  }
}

function updateActiveNavLink(pageName) {
  var links = document.querySelectorAll('.nav-link');
  for (var i = 0; i < links.length; i++) {
    links[i].classList.remove('active');
    if (links[i].getAttribute('data-page') === pageName) links[i].classList.add('active');
  }
  document.getElementById('navbar-nav').classList.remove('open');
}

function updatePendingCount(count) {
  var badge = document.getElementById('nav-pending-count');
  if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
  else { badge.classList.add('hidden'); }
}
</script>
