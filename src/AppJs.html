<script>
/* =============================================================
 * AppJs.html
 * Etat global, routeur, wrapper google.script.run,
 * utilitaires client, validation formulaire
 * ============================================================= */

// ===== ETAT GLOBAL =====
var App = { currentPage: null, userProfile: null, loading: false };

// ===== INITIALISATION =====
document.addEventListener('DOMContentLoaded', function() {
  App.userProfile = APP_USER_PROFILE;
  updateNavbar(App.userProfile);
  navigateTo(APP_INITIAL_PAGE, APP_PAGE_PARAMS);
  loadPendingCount();
  hideLoading();
});

// ===== NAVIGATION =====
function navigateTo(pageName, params) {
  if (App.loading) return;
  App.currentPage = pageName;
  updateActiveNavLink(pageName);

  var c = document.getElementById('app-content');
  c.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p class="text-muted mt-8">Chargement...</p></div>';

  switch (pageName) {
    case 'Dashboard':       loadDashboard(); break;
    case 'NouvelDemande':   loadNouvelDemande(); break;
    case 'DetailDemande':   loadDetailDemande(params); break;
    case 'MonProfil':       loadMonProfil(); break;
    case 'Administration':  loadAdministration(); break;
    default: c.innerHTML = '<div class="alert alert-danger">Page non trouvee : ' + pageName + '</div>';
  }

  try { google.script.history.push({page:pageName,params:params},{page:pageName}); } catch(e){}
}

try {
  google.script.history.setChangeHandler(function(e) {
    if (e && e.state && e.state.page) navigateTo(e.state.page, e.state.params);
  });
} catch(e){}

// ===== WRAPPER SERVER =====
function serverCall(functionName, args) {
  return new Promise(function(resolve, reject) {
    var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    if (args === undefined) runner[functionName]();
    else if (Array.isArray(args)) runner[functionName].apply(runner, args);
    else runner[functionName](args);
  });
}

// ===== PENDING COUNT =====
function loadPendingCount() {
  serverCall('server_getPendingForMe').then(function(r) { updatePendingCount(r ? r.length : 0); }).catch(function(){});
}

// ===== LOADING =====
function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

// ===== TOAST =====
function showToast(message, type) {
  type = type || 'info';
  var t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = message;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 4000);
}

// ===== MODAL =====
function showModal(htmlContent) {
  document.getElementById('modal-content').innerHTML = htmlContent;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(event) {
  if (event && event.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.add('hidden');
}
function forceCloseModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

// ===== UTILITAIRES CLIENT =====
function formatDateDisplay(dateStr) {
  if (!dateStr) return '-';
  var d = (dateStr instanceof Date) ? dateStr : new Date(dateStr);
  if (isNaN(d.getTime())) return String(dateStr);
  return d.getDate().toString().padStart(2,'0') + '/' + (d.getMonth()+1).toString().padStart(2,'0') + '/' + d.getFullYear();
}

function getStatusBadgeClass(statut) {
  var m = {'Soumis':'badge-soumis','Approuve N1':'badge-approuve-n1','Rejete N1':'badge-rejete-n1',
    'Valide':'badge-valide','Rejete':'badge-rejete-final','Annule':'badge-annule'};
  return m[statut] || 'badge-soumis';
}

function escapeHtml(str) {
  if (!str) return '';
  var d = document.createElement('div'); d.appendChild(document.createTextNode(str)); return d.innerHTML;
}

function buildDetailField(label, value) {
  return '<div class="detail-field"><div class="detail-label">' + escapeHtml(label) + '</div><div class="detail-value">' + escapeHtml(String(value||'-')) + '</div></div>';
}

// ===== MON PROFIL =====
function loadMonProfil() {
  var p = App.userProfile;
  if (!p) { document.getElementById('app-content').innerHTML = '<div class="alert alert-danger">Profil non disponible</div>'; return; }
  var roleLabels = {'EMPLOYE':'Employe','CHEF_AGENCE':'Chef d\'Agence','CHEF_AGENCE_SENIOR':'Chef d\'Agence Senior','CHEF_DEPARTEMENT':'Chef de Departement','RH':'Ressources Humaines','DIRECTEUR_CLIENTELE':'Directeur Clientele','DIRECTEUR_GENERAL':'Directeur General'};
  var html = '<div class="card"><div class="card-header"><h2 class="card-title">Mon Profil</h2></div><div class="detail-grid">';
  html += buildDetailField('Nom',p.nom) + buildDetailField('Prenom',p.prenom) + buildDetailField('Email',p.email);
  html += buildDetailField('Matricule',p.matricule) + buildDetailField('Poste',p.poste) + buildDetailField('Departement',p.departement);
  html += buildDetailField('Agence',p.agence||'Siege') + buildDetailField('Role',roleLabels[p.role]||p.role);
  html += '</div></div>';
  html += '<div class="card"><div class="card-header"><h2 class="card-title">Solde de Conges</h2></div><div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-value">'+(p.soldeConges||0)+'</div><div class="stat-label">Jours restants</div></div>';
  html += '<div class="stat-card"><div class="stat-value">'+(p.soldeInitial||30)+'</div><div class="stat-label">Allocation annuelle</div></div>';
  html += '</div></div>';
  document.getElementById('app-content').innerHTML = html;
}

// ===== VALIDATION FORMULAIRE =====
var ValidationFormulaire = {
  validateDemandeForm: function(f) {
    var e = {};
    if (!f.matricule || !/^M\d{4}$/.test(f.matricule)) e.matricule = 'Le matricule doit etre au format M suivi de 4 chiffres (ex: M0001)';
    if (!f.typeConge) e.typeConge = 'Veuillez selectionner un type de conge';
    if (f.typeConge === 'Absence exceptionnelle' && (!f.motif || !f.motif.trim())) e.motif = 'Le motif est obligatoire pour une absence exceptionnelle';
    if (!f.dateDebut) e.dateDebut = 'La date de debut est obligatoire';
    if (!f.dateFin) e.dateFin = 'La date de fin est obligatoire';
    if (f.dateDebut && f.dateFin && new Date(f.dateFin) < new Date(f.dateDebut)) e.dateFin = 'La date de fin doit etre posterieure a la date de debut';
    if (f.nbJours !== undefined && f.nbJours <= 0) e.nbJours = 'Le nombre de jours doit etre superieur a 0';
    if (f.typeConge === 'Conges payes' && f.soldeActuel !== undefined && f.nbJours > f.soldeActuel) e.nbJours = 'Solde insuffisant. Solde actuel : ' + f.soldeActuel + ' jours';
    return { valid: Object.keys(e).length === 0, errors: e };
  },
  showErrors: function(errors) {
    this.clearErrors();
    var fields = Object.keys(errors);
    for (var i = 0; i < fields.length; i++) {
      var input = document.querySelector('[name="'+fields[i]+'"]');
      if (input) {
        input.classList.add('error');
        var div = document.createElement('div'); div.className = 'form-error'; div.textContent = errors[fields[i]];
        div.setAttribute('data-error-for', fields[i]);
        input.parentNode.appendChild(div);
      }
    }
  },
  clearErrors: function() {
    var ei = document.querySelectorAll('.form-input.error,.form-select.error,.form-textarea.error');
    for (var i = 0; i < ei.length; i++) ei[i].classList.remove('error');
    var ed = document.querySelectorAll('.form-error');
    for (var j = 0; j < ed.length; j++) ed[j].parentNode.removeChild(ed[j]);
  }
};
</script>
